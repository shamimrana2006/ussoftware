<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf8f4" />
      <stop offset="50%" stop-color="#edf9f6" />
      <stop offset="100%" stop-color="#d8f3ec" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008744" />
      <stop offset="100%" stop-color="#006b36" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aeead9" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border / Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6" />

  <!-- Head -->
  <circle cx="200" cy="155" r="58" fill="url(#avatarGrad)" opacity="0.75" />

  <!-- Shoulders / Body -->
  <path d="M96 340 C104 252, 148 232, 200 232 C252 232, 296 252, 304 340 Z" fill="url(#avatarGrad)" opacity="0.75" />
</svg>
