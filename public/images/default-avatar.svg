  <!-- Head -->
  <circle cx="200" cy="155" r="58" fill="url(#avatarGrad)" />

  <!-- Shoulders / Body -->
  <path d="M96 340 C104 252, 148 232, 200 232 C252 232, 296 252, 304 340 Z" fill="url(#avatarGrad)" />
</svg>
